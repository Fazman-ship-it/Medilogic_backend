[alembic]
# Path to migration scripts
script_location = alembic

# Database URL (replace with your own)
sqlalchemy.url = postgresql://neondb_owner:npg_hN1Y8XeHupUk@ep-morning-term-abh93wxp-pooler.eu-west-2.aws.neon.tech/neondb?sslmode=require&channel_binding=require

# Logging configuration
[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s